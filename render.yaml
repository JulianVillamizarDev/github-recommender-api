services:
  - type: web
    name: github-recommendation
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    # Bind to 0.0.0.0:$PORT so Render can detect the open port.
    startCommand: "gunicorn githubrecommender.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # GITHUB_TOKEN must be set manually in the Render dashboard (it's a secret).
      - key: GITHUB_TOKEN
        sync: false
      # Comma-separated browser origins allowed to call the API (your deployed
      # frontend URL). Update once the frontend is deployed.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
